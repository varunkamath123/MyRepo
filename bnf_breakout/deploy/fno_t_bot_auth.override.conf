# Drop-in for fno_t_bot_auth.service  ->  /etc/systemd/system/fno_t_bot_auth.service.d/override.conf
#
# The stock unit ends with
#   ExecStartPost=+/bin/systemctl restart --no-block fno_t_bot_nifty fno_t_bot_banknifty fno_t_bot_sensex
# i.e. EVERY token refresh restarted the three parked bots. "systemctl disable" does not
# stop an explicit restart, so parking them by disabling was undone the next morning
# at 08:45 (found on 2026-10-21 when enabling bnf_breakout ran the auth job and all
# three came back).
#
# An empty ExecStartPost= clears the inherited list. bnf_breakout does not need a
# restart: it rebuilds its Fyers client from the new token itself.
#
# To revive the parked system: delete this drop-in, `systemctl unmask` the three
# services, `systemctl daemon-reload`.
[Service]
ExecStartPost=
